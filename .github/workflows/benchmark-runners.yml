name: AtlasOps Windows-target build benchmark

run-name: AtlasOps Windows-target build benchmark

on:
  push:
    paths:
      - .github/workflows/benchmark-runners.yml
      - AtlasOps.sln
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - nuget.config
      - src/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: atlasops-build-benchmark-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows target on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            name: Linux x64
            host_os: linux
            runner: ubuntu-latest
          - id: windows-x64
            name: Windows x64
            host_os: windows
            runner: windows-latest

    steps:
      - name: Check out AtlasOps
        uses: actions/checkout@v7

      - name: Configure .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Move NuGet caches to the runner temp disk
        if: ${{ matrix.host_os == 'windows' }}
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'nuget\packages'
          $httpCache = Join-Path $env:RUNNER_TEMP 'nuget\http-cache'
          New-Item -ItemType Directory -Force -Path $packages, $httpCache | Out-Null
          "NUGET_PACKAGES=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NUGET_HTTP_CACHE_PATH=$httpCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NUGET_PACKAGES=$packages"
          Write-Host "NUGET_HTTP_CACHE_PATH=$httpCache"
        shell: pwsh

      - name: Restore AtlasOps dependencies
        run: |
          New-Item -Path timing -ItemType Directory -Force | Out-Null

          $restoreStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet restore AtlasOps.sln --nologo -m:4 -p:EnableWindowsTargeting=true -p:Configuration=Release -bl:"timing/restore-${{ matrix.id }}.binlog"
          $restoreExitCode = $LASTEXITCODE
          $restoreStopwatch.Stop()

          $restoreDuration = [math]::Round($restoreStopwatch.Elapsed.TotalSeconds, 2)
          $restoreTiming = [ordered]@{
            phase = 'restore'
            durationSeconds = $restoreDuration
            exitCode = $restoreExitCode
          }

          $restoreTiming | ConvertTo-Json | Set-Content -Path "timing/restore-time-${{ matrix.id }}.json"

          if ($restoreExitCode -ne 0) {
            throw "dotnet restore failed with exit code $restoreExitCode"
          }
        shell: pwsh

      - name: Build AtlasOps Windows target
        run: |
          $buildStopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          dotnet build AtlasOps.sln --nologo --configuration Release --no-restore -m:4 -p:EnableWindowsTargeting=true -bl:"timing/build-${{ matrix.id }}.binlog"
          $buildExitCode = $LASTEXITCODE
          $buildStopwatch.Stop()

          $buildDuration = [math]::Round($buildStopwatch.Elapsed.TotalSeconds, 2)
          $restoreDuration = [math]::Round((Get-Content -Raw -Path "timing/restore-time-${{ matrix.id }}.json" | ConvertFrom-Json).durationSeconds, 2)
          $totalDuration = [math]::Round($restoreDuration + $buildDuration, 2)
          $timing = [ordered]@{
            id = '${{ matrix.id }}'
            name = '${{ matrix.name }}'
            hostOs = '${{ matrix.host_os }}'
            runner = '${{ matrix.runner }}'
            targetFramework = 'net10.0-windows'
            restoreSeconds = $restoreDuration
            buildSeconds = $buildDuration
            totalSeconds = $totalDuration
            succeeded = ($buildExitCode -eq 0)
          }

          $timing | ConvertTo-Json | Set-Content -Path "timing/build-time-${{ matrix.id }}.json"

          $result = if ($buildExitCode -eq 0) { 'success' } else { 'failure' }
          @(
            "## AtlasOps Windows-target build (${{ matrix.name }})",
            '',
            "- Host OS: ${{ matrix.host_os }}",
            "- Runner: ${{ matrix.runner }}",
            "- Target framework: net10.0-windows",
            "- Restore duration: $($timing.restoreSeconds)s",
            "- Core build duration: $($timing.buildSeconds)s",
            "- Total duration: $($timing.totalSeconds)s",
            "- Result: $result"
          ) | Out-File -FilePath $Env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          exit $buildExitCode
        shell: pwsh

      - name: Upload build timing and binlogs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: atlasops-build-time-${{ matrix.id }}
          path: |
            timing/*.json
            timing/*.binlog

  compare-timings:
    name: Compare Windows-target build times
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build timings
        uses: actions/download-artifact@v8
        with:
          pattern: atlasops-build-time-*
          path: build-timings
          merge-multiple: true

      - name: Summarize build times
        run: |
          $timings = Get-ChildItem -Path build-timings -Filter build-time-*.json |
            ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json } |
            Sort-Object totalSeconds

          if (-not $timings) {
            throw 'No AtlasOps build timing artifacts were found.'
          }

          $fastest = ($timings | Measure-Object -Property totalSeconds -Minimum).Minimum
          $lines = @(
            '## AtlasOps Windows-target build comparison',
            '',
            '| Host | Runner | Target | Restore (s) | Core build (s) | Total (s) | Delta (s) | Result |',
            '| --- | --- | --- | ---: | ---: | ---: | ---: | --- |'
          )

          foreach ($timing in $timings) {
            $delta = [math]::Round([double]$timing.totalSeconds - [double]$fastest, 2)
            $result = if ($timing.succeeded) { 'success' } else { 'failure' }
            $lines += "| $($timing.name) | $($timing.runner) | $($timing.targetFramework) | $($timing.restoreSeconds) | $($timing.buildSeconds) | $($timing.totalSeconds) | $delta | $result |"
          }

          $lines | Out-File -FilePath $Env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | ForEach-Object { Write-Host $_ }
        shell: pwsh
